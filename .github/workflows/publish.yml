name: 인스타 자동 게시

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 확인 (깃허브 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:           # 깃허브 화면에서 바로 실행하는 버튼
    inputs:
      check_only:
        description: "토큰 연결만 확인하고 게시는 하지 않기"
        type: boolean
        default: true
      test_video:
        description: "영상 장 처리만 시험하기 (게시하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 예약 시간이 된 게시물 올리기
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish.py ${{ inputs.test_video && '--test-video' || (inputs.check_only && '--check' || '') }}
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "timeisgold-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "게시 결과 기록"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
